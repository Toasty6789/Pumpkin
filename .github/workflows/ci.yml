# =============================================================================
# Continuous Integration Workflow
# =============================================================================
#
# This workflow enforces the core quality gates required for every push and
# pull request. Each stage must pass before merging:
#
#   Stage 1 — cargo check      (compilation correctness)
#   Stage 2 — cargo fmt --check (style enforcement)
#   Stage 3 — cargo clippy      (lint with -D warnings)
#   Stage 4 — cargo test        (unit, integration, and doc tests)
#
# =============================================================================

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ── Stage 1: Compilation Check ───────────────────────────────────────────
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (all targets)
        run: cargo check --all-targets --all-features

  # ── Stage 2: Formatting ──────────────────────────────────────────────────
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup update stable && rustup default stable
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

  # ── Stage 3: Clippy Lints (deny warnings) ────────────────────────────────
  clippy:
    name: cargo clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup update stable && rustup default stable
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Stage 4: Tests ───────────────────────────────────────────────────────
  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: [check, fmt, clippy]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-features --verbose

      - name: cargo test (doc)
        run: cargo test --doc --verbose

  # ── Status badge helper ──────────────────────────────────────────────────
  ci-pass:
    name: CI checks passed
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - run: echo "All CI stages passed."
